services:
  - type: web
    name: backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DB_HOST
        value: postgres
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        value: email_scheduler
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: email_scheduler
      - key: REDIS_HOST
        value: redis
      - key: REDIS_PORT
        value: "6379"
      - key: ELASTICSEARCH_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  - type: worker
    name: backend-worker
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: node dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: postgres
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        value: email_scheduler
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: email_scheduler
      - key: REDIS_HOST
        value: redis
      - key: REDIS_PORT
        value: "6379"
      - key: ELASTICSEARCH_URL
        sync: false
      - key: MAX_EMAILS_PER_HOUR
        value: "200"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "50"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: "2000"
    autoDeploy: true

  - type: web
    name: frontend
    env: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        sync: false
    autoDeploy: true

  - type: web
    name: postgres
    runtime: image
    plan: free
    image:
      url: postgres:15-alpine
    envVars:
      - key: POSTGRES_DB
        value: email_scheduler
      - key: POSTGRES_USER
        value: email_scheduler
      - key: POSTGRES_PASSWORD
        sync: false

  - type: web
    name: redis
    runtime: image
    plan: free
    image:
      url: redis:7-alpine
